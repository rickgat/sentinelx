{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sentinelx.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sentinelx.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sentinelx.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Same-namespace traffic.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
      ports:
        - port: 8080
          protocol: TCP
        - port: 9090
          protocol: TCP
    {{- if .Values.networkPolicy.allowFromIngressNamespace }}
    # Ingress controller namespace.
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.ingressNamespaceSelector | nindent 12 }}
      ports:
        - port: 8080
          protocol: TCP
    {{- end }}
  egress:
    # DNS — always required.
    {{- if .Values.networkPolicy.egress.extraDns.enabled }}
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- end }}
    # PostgreSQL.
    {{- if .Values.networkPolicy.egress.postgres.cidrs }}
    - to:
        {{- range .Values.networkPolicy.egress.postgres.cidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - port: {{ .Values.networkPolicy.egress.postgres.port }}
          protocol: TCP
    {{- end }}
    # Redis.
    {{- if .Values.networkPolicy.egress.redis.cidrs }}
    - to:
        {{- range .Values.networkPolicy.egress.redis.cidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - port: {{ .Values.networkPolicy.egress.redis.port }}
          protocol: TCP
    {{- end }}
    # OTel collector.
    {{- if .Values.networkPolicy.egress.otel.cidrs }}
    - to:
        {{- range .Values.networkPolicy.egress.otel.cidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - port: {{ .Values.networkPolicy.egress.otel.port }}
          protocol: TCP
    {{- end }}
{{- end }}
