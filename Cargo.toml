resolver = "2"
members = [
    "crates/sx-config",
    "crates/sx-core",
    "crates/sx-telemetry",
    "crates/sx-iam",
    "crates/sx-audit",
    "crates/sx-storage",
    "crates/sx-engagement",
    "crates/sx-risk",
    "crates/sx-discovery",
    "crates/sx-api",
    "crates/sx-graph",
    "crates/sx-report",
    "crates/sx-remediation",
    "crates/sx-compliance",
    "crates/sx-bas",
    "crates/sx-chaos",
    "crates/sx-collab",
    "crates/sx-ml",
    "crates/sx-cloud",
    "crates/sx-autonomy",
    "crates/sx-intel-ioc",
    "crates/sx-intel-feeds",
    "crates/sx-secrets",
    "crates/sx-dlp",
    "crates/sx-policy",
    "crates/sx-twin",
    "crates/sx-integrations",
    "crates/sx-mtls",
    "crates/sx-soc",
    "crates/sx-log-ingest",
    "crates/sx-webhooks",
    "crates/sx-vuln-ingest",
    "crates/sx-scim",
    "crates/sx-rba",
    "crates/sx-device-trust",
    "crates/sx-soar",
    "crates/sx-plugins",
    "crates/sx-ir-playbooks",
    "crates/sx-runtime",
    "crates/sx-hunt",
    "crates/sx-ueba",
    "crates/sx-pentest",
    "crates/sx-xmlsec",
    "crates/sx-ai-audit",
    "crates/sx-bench",
    "services/sx-monolith",
    "services/sx-cli",
    "services/sx-agent",
