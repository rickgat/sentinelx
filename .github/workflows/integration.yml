---
name: integration

# Runs the full end-to-end smoke: ignored live-deps tests + a foreground
# sx-monolith + curl-based 5-step HTTP smoke against a Postgres + Redis
# pair provided by GitHub Actions service containers. This is gated to
# `main` + PRs so the offline `ci.yml` stays the fast pre-merge gate and
# this job catches integration regressions on the merge queue.

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RUSTFLAGS: "-D warnings"
  # Fixed credentials for the service containers — these are ephemeral CI
  # secrets, never reused outside the runner.
  POSTGRES_USER: sentinelx
  POSTGRES_PASSWORD: ci-only-not-a-real-secret
  POSTGRES_DB: sentinelx
  REDIS_PASSWORD: ci-only-not-a-real-secret
  # Smoke client config — must match the bootstrap admin pin in
  # scripts/integration-smoke.sh::export_env.
  SX_BOOTSTRAP_TENANT_ID: 00000000-0000-0000-0000-000000000001
  SX_BOOTSTRAP_EMAIL: admin@example.invalid
  SX_BOOTSTRAP_PASSWORD: sentinelx-admin-pw

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: smoke (postgres + redis + http)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sentinelx
          POSTGRES_PASSWORD: ci-only-not-a-real-secret
          POSTGRES_DB: sentinelx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinelx -d sentinelx"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: integration

      - name: Install host tools (jq, curl)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends jq curl

      # Service containers boot Redis without a password by default. The
      # smoke script defaults expect `:${REDIS_PASSWORD}@...` so we point
      # the test URL at the password-less instance here and skip the
      # docker compose stack the script would otherwise bring up.
      - name: Export TEST_DATABASE_URL / SX_TEST_REDIS_URL
        run: |
          {
            echo "TEST_DATABASE_URL=postgres://sentinelx:ci-only-not-a-real-secret@127.0.0.1:5432/sentinelx?sslmode=disable"
            echo "SX_TEST_REDIS_URL=redis://127.0.0.1:6379/0"
          } >> "$GITHUB_ENV"

      - name: Run ignored live-deps tests
        run: cargo test --workspace --no-fail-fast -- --ignored

      - name: Build sx-monolith (release)
        run: cargo build -p sx-monolith --release

      # Materialise a CI config from the in-tree example. The example yaml
      # ships with placeholder secrets (CHANGE_ME tokens) that pass the
      # length validators; SENTINELX__* env overrides then flip database +
      # redis + bootstrap to point at the live service containers.
      - name: Materialise CI config
        run: |
          mkdir -p config
          cp config/sentinelx.example.yaml config/sentinelx.ci.yaml
          echo "SENTINELX_CONFIG=$(pwd)/config/sentinelx.ci.yaml" \
            >> "$GITHUB_ENV"

      - name: Boot sx-monolith
        env:
          SENTINELX__DATABASE__URL: ${{ env.TEST_DATABASE_URL }}
          SENTINELX__DATABASE__ENABLED: "true"
          SENTINELX__DATABASE__MIGRATE_ON_START: "true"
          SENTINELX__REDIS__URL: ${{ env.SX_TEST_REDIS_URL }}
          SENTINELX__REDIS__ENABLED: "true"
          SENTINELX__SERVER__BIND_ADDR: "127.0.0.1:8080"
          SENTINELX__BOOTSTRAP__ENABLED: "true"
          SENTINELX__BOOTSTRAP__ADMIN_TENANT_ID: ${{ env.SX_BOOTSTRAP_TENANT_ID }}
          SENTINELX__BOOTSTRAP__ADMIN_EMAIL: ${{ env.SX_BOOTSTRAP_EMAIL }}
          # Argon2id PHC for the password `sentinelx-admin-pw`; matches
          # the pin in scripts/integration-smoke.sh::export_env.
          SENTINELX__BOOTSTRAP__ADMIN_PASSWORD_PHC: >-
            $argon2id$v=19$m=19456,t=2,p=1$c2VudGluZWx4c21va2VzYWx0$jR3CmU4PqJtmCaP9WzkAyMnLpRkr7q2ETkU+/wjpVK0
        run: |
          nohup ./target/release/sx-monolith > /tmp/sx-monolith.log 2>&1 &
          echo $! > /tmp/sx-monolith.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1; then
              echo "monolith healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "monolith failed to become healthy in 60s"
          tail -n 200 /tmp/sx-monolith.log
          exit 1

      - name: Run HTTP smoke (5 steps)
        env:
          SX_BASE_URL: http://127.0.0.1:8080
        run: bash tests/integration/smoke.sh

      - name: Stop sx-monolith
        if: always()
        run: |
          if [ -f /tmp/sx-monolith.pid ]; then
            pid="$(cat /tmp/sx-monolith.pid)"
            if kill -0 "$pid" 2>/dev/null; then
              kill "$pid" || true
              wait "$pid" 2>/dev/null || true
            fi
          fi

      - name: Tail monolith log on failure
        if: failure()
        run: |
          if [ -f /tmp/sx-monolith.log ]; then
            echo '--- /tmp/sx-monolith.log (last 200 lines) ---'
            tail -n 200 /tmp/sx-monolith.log
          fi
