apiVersion: constraints.gatekeeper.sh/v1beta1
kind: SxDenyHostNetwork
metadata:
  name: sentinelx-no-host-network
spec:
  enforcementAction: deny
  match:
    namespaces:
      - sentinelx
    kinds:
      - apiGroups:
          - apps
        kinds:
          - Deployment
          - StatefulSet
          - DaemonSet
      - apiGroups:
          - argoproj.io
        kinds:
          - Rollout
