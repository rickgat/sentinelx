# Child Application: sx-monolith.
# Renders the Helm chart at deploy/helm/sentinelx into the `sentinelx`
# namespace. The chart's `rollout.enabled` value MUST be true so the
# in-chart Deployment is suppressed in favour of the Rollout CR shipped
# from deploy/rollouts/monolith-rollout.yaml.
#
# Sync wave 10 — runs AFTER infra (postgres/redis/otel/jaeger waves 0-5).
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sentinelx-monolith
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: sentinelx-monolith
    app.kubernetes.io/part-of: sentinelx
    app.kubernetes.io/component: app
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    notifications.argoproj.io/subscribe.on-deployed.slack: sentinelx-releases
    notifications.argoproj.io/subscribe.on-health-degraded.slack: sentinelx-alerts
spec:
  project: sentinelx
  sources:
    # Chart source (templated by Argo CD via the helm plugin).
    - repoURL: https://github.com/sentinelx/security-check
      targetRevision: main
      path: deploy/helm/sentinelx
      helm:
        releaseName: sx-monolith
        valueFiles:
          - values.yaml
        parameters:
          - name: rollout.enabled
            value: "true"
          - name: image.tag
            value: "$ARGOCD_APP_REVISION_SHORT"
            forceString: true
    # Rollout + analysis template + stable/canary Services live alongside
    # the chart but are applied directly (not via the chart) so they can
    # be updated without bumping the chart version.
    - repoURL: https://github.com/sentinelx/security-check
      targetRevision: main
      path: deploy/rollouts
      directory:
        recurse: false
        include: "{monolith-rollout.yaml,analysis-template.yaml,service-stable.yaml,service-canary.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: sentinelx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - Replace=false
      - PruneLast=true
      - CreateNamespace=true
      - ServerSideApply=true
      - PrunePropagationPolicy=foreground
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
  revisionHistoryLimit: 10
  ignoreDifferences:
    # Argo Rollouts mutates replica counts on the underlying ReplicaSets
    # during canary steps; ignore so Argo CD doesn't flap them.
    - group: apps
      kind: ReplicaSet
      jsonPointers:
        - /spec/replicas
    - group: argoproj.io
      kind: Rollout
      jsonPointers:
        - /spec/replicas
