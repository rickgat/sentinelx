# SentinelX local-multiregion: nginx round-robin LB.
#
# Health: GET /lb-health -> 200 from nginx itself (so docker-compose
#         healthcheck does not depend on the upstream).
# Upstream health: nginx's open-source build does no active probing; the
#         monolith containers have their own /healthz checks and
#         compose only marks the LB ready after both upstreams are
#         healthy. For active health checks use nginx-plus or a sidecar.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    upstream sx_monoliths {
        # Round-robin (the default). max_fails / fail_timeout trigger
        # passive ejection on 5xx storms.
        server monolith_primary:8080 max_fails=3 fail_timeout=10s;
        server monolith_standby:8080 max_fails=3 fail_timeout=10s;
    }

    # Buffering off so streaming responses (SARIF, SSE if ever wired)
    # don't pool in nginx.
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    server {
        listen 8090;

        # LB self-health — independent of upstream so we can distinguish
        # "LB up, monolith down" from "LB down".
        location = /lb-health {
            access_log off;
            return 200 "lb-ok\n";
            add_header Content-Type text/plain;
        }

        # Forward every other path to the round-robin pool.
        location / {
            proxy_pass http://sx_monoliths;
            proxy_connect_timeout 5s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
            proxy_next_upstream   error timeout http_502 http_503 http_504;
        }
    }
}
