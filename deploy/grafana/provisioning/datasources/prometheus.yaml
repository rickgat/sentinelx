apiVersion: 1

datasources:
  - name: prometheus
    type: prometheus
    access: proxy
    # In compose: http://prometheus:9090; in K8s: configure via overlay.
    url: http://prometheus:9090
    uid: prometheus
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "15s"
      httpMethod: POST
      manageAlerts: true
      prometheusType: Prometheus
      prometheusVersion: "2.55.0"
