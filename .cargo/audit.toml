# cargo-audit configuration for the SentinelX workspace.
#
# Policy (LOW-001):
#   - Every RUSTSEC advisory the workspace transitively depends on MUST either
#     be remediated (bump the dep) or appear in `[advisories.ignore]` below
#     WITH a justification comment that names a tracking ticket and a remediation
#     date. The CI gate (.github/workflows/audit.yml) hard-fails on ANY
#     advisory that is not listed here.
#   - We do NOT downgrade severity. The audit gate is binary: clean or break.
#   - "Unmaintained" / "yanked" advisories count the same as CVEs; the only
#     way to silence them is an entry in `[advisories.ignore]`.
#
# Triage ledger (LOW-001-FU1, 2026-06-16):
#   Wave 1 (2026-06-15) — gate landed fail-closed with 29 open advisories.
#   Wave 2 (2026-06-16) — 18 of 29 advisories triaged into ignores with
#   structured justifications; 11 of 29 remediated by dep bumps:
#     * wasmtime 26.0.1 -> 24.0.7  (10 advisories patched in the 24.x backport)
#     * validator    0.18 -> 0.20  (idna RUSTSEC-2024-0421 patched, proc-macro-error
#                                   dropped — replaced by proc-macro-error2 which has
#                                   its own unmaintained entry below)
#     * bitflags     2.12.0 -> 2.13.0  (yanked version replaced)
#   See docs/runbooks/supply-chain.md §5 (LOW-001-FU1 entry) for the per-ID
#   disposition table.
#
# Triage ledger (LOW-001-FU2, 2026-06-23):
#   Cascade dep bump landed: rustc 1.88 -> 1.92, AWS SDK 1.5 -> 1.8 line,
#   wasmtime 24.0.7 -> 36.0.11, plus a quinn-proto patch update for the
#   newly-disclosed RUSTSEC-2026-0185 (DoS). Net effect: 10 wave-2 ignores
#   removed from the list below (3 rustls-webpki, 6 wasmtime, 1 lru) and
#   1 unmaintained entry retired (rustls-pemfile 1.x is no longer in the
#   dep graph; 2.x is no longer flagged). Remaining ignores: 7 entries
#   covering the 4 still-open follow-ups (FU3..FU6). See
#   docs/runbooks/supply-chain.md §6 for the per-ID disposition table.
#
# Ignoring an advisory (template — copy, fill, get review):
#
#   [advisories]
#   ignore = [
#     # RUSTSEC-YYYY-NNNN — <crate>@<version>
#     # Reason: <why this is safe for our exposure surface>
#     # Tracking: docs/SECURITY_GAP_REMEDIATION_TASKS.md#<ticket-id>
#     # Re-evaluate by: YYYY-MM-DD
#     "RUSTSEC-YYYY-NNNN",
#   ]
#
# See docs/runbooks/supply-chain.md for the end-to-end ignore + escalation flow.

[advisories]
informational_warnings = ["unmaintained", "unsound", "yanked"]
severity_threshold = "none"

