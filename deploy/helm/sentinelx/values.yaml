# Default values for sentinelx Helm chart.
# These values are intentionally minimal-but-safe. For a fully-commented
# walkthrough of every field, see values.example.yaml in this directory.

nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/sentinelx/sx-monolith
  tag: "0.1.0"
  pullPolicy: IfNotPresent
  pullSecrets: []

replicaCount: 3

# Strategy: rolling update by default.
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

serviceAccount:
  create: true
  name: ""
  annotations: {}
  # Set to true ONLY if the workload needs to talk to the Kubernetes API.
  automountToken: false

# Pod-level securityContext (least-privilege defaults).
podSecurityContext:
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# Container-level securityContext.
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65632
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: "200m"
    memory: "256Mi"
  limits:
    cpu: "1"
    memory: "1Gi"

# Liveness / readiness / startup probes.
probes:
  liveness:
    path: /healthz
    port: http
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    path: /readyz
    port: http
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3
  startup:
    enabled: true
    path: /healthz
    port: http
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 30

service:
  type: ClusterIP
  httpPort: 8080
  metricsPort: 9090
  annotations: {}

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: sentinelx.example.invalid
      paths:
        - path: /
          pathType: Prefix
  tls: []

# PodDisruptionBudget.
pdb:
  enabled: true
  minAvailable: 1
  maxUnavailable: null

# Topology spread + anti-affinity for HA.
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: sentinelx

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: sentinelx
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: sentinelx

nodeSelector: {}
tolerations: []
priorityClassName: ""

# Telemetry config.
metrics:
  enabled: true
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    namespace: ""
    additionalLabels: {}
    relabelings: []
    metricRelabelings: []

# Network policy.
networkPolicy:
  enabled: true
  # If true, allow traffic from the ingress-controller namespace.
  allowFromIngressNamespace: false
  ingressNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: ingress-nginx
  # Egress destinations (CIDRs or namespace selectors).
  egress:
    postgres:
      port: 5432
      cidrs: []      # e.g. ["10.0.0.10/32"]
    redis:
      port: 6379
      cidrs: []
    otel:
      port: 4317
      cidrs: []
    extraDns:
      enabled: true  # cluster DNS (kube-dns/CoreDNS UDP/TCP 53)

# Migration Job (sqlx migrate run).
migrationJob:
  enabled: true
  image:
    repository: ghcr.io/sentinelx/sx-monolith
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  command:
    - /usr/local/bin/sx-monolith
    - migrate
    - run
  backoffLimit: 3
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

# Config rendered into a ConfigMap and mounted at /etc/sentinelx/config.yaml.
config:
  server:
    bind_addr: "0.0.0.0:8080"
    shutdown_timeout: 30
    request_timeout: 30
    max_body_bytes: 1048576
    rate_limit:
      limit_per_minute: 600
      burst: 60
      enabled: true
  database:
    max_connections: 20
    min_connections: 2
    acquire_timeout: 10
    idle_timeout: 300
    statement_timeout_ms: 15000
  redis:
    pool_size: 10
    command_timeout: 2
  jwt:
    issuer: "https://sentinelx.example.invalid"
    audience: "sentinelx-api"
    key_id: "kid-2026-05"
    algorithm: "HS256"
    access_ttl: 900
    refresh_ttl: 604800
    leeway_seconds: 30
  telemetry:
    service_name: "sx-monolith"
    environment: "prod"
    log_level: "info"
    log_format: "json"
    sample_ratio: 0.1
    prometheus_bind: "0.0.0.0:9090"
  risk:
    weights:
      w_severity: 0.25
      w_exploit: 0.20
      w_exposure: 0.15
      w_criticality: 0.20
      w_business_impact: 0.15
      w_chain: 0.05
    kev_boost_factor: 1.25
    epss_threshold_act: 0.50
  engagement:
    max_concurrent: 16
    default_intensity: "normal"
    kill_switch_channel: "sentinelx.killswitch"
    killswitch_watchdog_interval: 1
    global_denylist:
      - kind: "regex"
        value: "^.*\\.gov$"
        reason: "government domains require explicit authorization"
      - kind: "regex"
        value: "^.*\\.mil$"
        reason: "military domains require explicit authorization"
  iam:
    password:
      m_cost: 19456
      t_cost: 2
      p_cost: 1
      output_len: 32
      salt_len: 16
    session_inactivity_timeout: 1800
    mfa_required: true
    lockout:
      threshold: 5
      window: 900
      duration: 900
  discovery:
    dns_resolvers:
      - "1.1.1.1:53"
      - "9.9.9.9:53"
    max_concurrent_probes: 64
    per_target_rps_limit: 10
    http_user_agent: "SentinelX/0.1 (+https://sentinelx.example.invalid)"
    http_timeout: 10
    port_scan_max_ports: 1024

# Secret values. ALL fields below MUST be overridden in production via
# --set / -f overrides / external secret manager. The defaults are
# deliberately invalid so the chart fails closed.
secrets:
  # Use an existing Secret instead of creating one (recommended for prod).
  existingSecret: ""
  # Otherwise the chart creates a Secret from these values.
  create: true
  databaseUrl: "postgres://CHANGE_ME@postgres:5432/sentinelx?sslmode=require"
  redisUrl: "redis://:CHANGE_ME@redis:6379/0"
  jwtSigningKey: "CHANGE_ME_AT_LEAST_32_BYTES_BASE64"
  attemptPepper: "CHANGE_ME_AT_LEAST_16_BYTES_RANDOM"
  bootstrapAdminPhc: "CHANGE_ME_ARGON2ID_PHC_STRING"

# Telemetry endpoint env (OTLP exporter).
telemetry:
  otlpEndpoint: "http://otel-collector.observability.svc.cluster.local:4317"

# Extra env vars (advanced users).
extraEnv: []
# - name: RUST_LOG
#   value: info

extraVolumes: []
extraVolumeMounts: []

# A tmpfs writable scratch dir is mounted automatically because the root
# filesystem is read-only.
scratchTmpfs:
  enabled: true
  sizeLimit: "64Mi"

# HIGH-009 — Kubernetes admission webhook (blocking mode).
#
# Registers SentinelX as a `ValidatingWebhookConfiguration` target. The
# apiserver POSTs every CREATE / UPDATE for Pods + workload kinds that
# embed a PodSpec to `POST /v1/runtime/k8s/admit`. cert-manager injects
# the CA bundle into the webhook config via the
# `cert-manager.io/inject-ca-from` annotation; see
# `templates/admission-webhook.yaml`.
admissionWebhook:
  enabled: false
  # Apiserver-side timeout for the webhook call. The engine itself is
  # cheap (single JSON walk through the rule pack); a 5s timeout leaves
  # plenty of headroom for cold-start TLS handshakes while still
  # surfacing a stuck pod within the apiserver's tolerance.
  timeoutSeconds: 5
  # `Fail` (default) → cluster rejects new workloads when the webhook is
  # unreachable. `Ignore` → cluster admits anyway (with an audit-log
  # trail). Production should prefer `Fail` to enforce posture; flip to
  # `Ignore` during incremental rollout if uptime matters more than
  # enforcement strictness.
  failurePolicy: Fail
  # Namespaces hard-skipped at the apiserver level (the engine's per-pack
  # opt-out is a second line of defence). MUST include the kube-system
  # family or the cluster will brick on the next upgrade.
  skipNamespaces:
    - kube-system
    - kube-public
    - kube-node-lease
    - cert-manager
  certManager:
    issuerRef:
      # Replace with the cluster's CA `ClusterIssuer` for production.
      name: selfsigned-issuer
      kind: Issuer
      group: cert-manager.io
