[package]
name = "sx-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish = false
description = "SentinelX HTTP API gateway: controllers, views, middleware (MVC)."

[lints]
workspace = true

[dependencies]
sx-config = { workspace = true }
sx-core = { workspace = true }
sx-iam = { workspace = true }
sx-discovery = { workspace = true }
sx-chaos = { workspace = true }
sx-collab = { workspace = true }
sx-policy = { workspace = true }
sx-scim = { workspace = true }
sx-soar = { workspace = true }
sx-device-trust = { workspace = true }
sx-plugins = { workspace = true }
sx-runtime = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
tower = { workspace = true }
tower-http = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "logging", "tls12"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
validator = { workspace = true }
secrecy = { workspace = true }
prometheus = { version = "0.13", default-features = false }
jsonwebtoken = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
sx-secrets = { workspace = true }
tracing-subscriber = { workspace = true }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"] }
tempfile = "3"
sx-mtls = { workspace = true }
