[package]
name = "sx-iam-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.sx-iam]
path = ".."

# Pin so the fuzz crate is not part of the workspace (cargo-fuzz convention).
[workspace]

[[bin]]
name = "jwt_decode"
path = "fuzz_targets/jwt_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "saml_response_fuzz"
path = "fuzz_targets/saml_response_fuzz.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
