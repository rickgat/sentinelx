{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sentinelx.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sentinelx.labels" . | nindent 4 }}
type: Opaque
stringData:
  # All values MUST be overridden at deploy time.
  database-url: {{ .Values.secrets.databaseUrl | quote }}
  redis-url: {{ .Values.secrets.redisUrl | quote }}
  jwt-signing-key: {{ .Values.secrets.jwtSigningKey | quote }}
  attempt-pepper: {{ .Values.secrets.attemptPepper | quote }}
  bootstrap-admin-phc: {{ .Values.secrets.bootstrapAdminPhc | quote }}
{{- end }}
