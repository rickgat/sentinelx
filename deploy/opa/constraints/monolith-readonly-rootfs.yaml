apiVersion: constraints.gatekeeper.sh/v1beta1
kind: SxRequireReadOnlyRootFS
metadata:
  name: sentinelx-readonly-rootfs
spec:
  enforcementAction: deny
  match:
    namespaces:
      - sentinelx
    kinds:
      - apiGroups:
          - apps
        kinds:
          - Deployment
          - StatefulSet
          - DaemonSet
      - apiGroups:
          - argoproj.io
        kinds:
          - Rollout
