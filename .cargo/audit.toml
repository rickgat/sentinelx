# is gated on a hard constraint (missing upstream patch, or multi-day
# API migration) that is itself tracked as a separate ticket. The
# expiry dates are uniformly 2026-12-15 — six months out, on the
# explicit triage rationale captured in `docs/runbooks/supply-chain.md`.

