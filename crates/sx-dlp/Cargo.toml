[package]
name = "sx-dlp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish = false
description = "SentinelX DLP content-inspection: regex + Luhn matchers (PAN, US SSN, AWS access/secret keys, GitHub PAT, JWT, PEM private key) with an `InMemoryDlpService` and `DlpScanResult` projection. Raw payloads are never persisted by this crate."

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
