# Rollout for the SentinelX monolith.
# Replaces the Deployment shipped by the Helm chart. The Helm chart MUST set
# `rollout.enabled: true` so the Deployment template is suppressed.
#
# Mapped controls:
#   NIST SP 800-53 CM-3 (Change control)
#   ISO/IEC 27001 A.8.32 (Change management)
#   SOC2 CC8.1 (Change management)
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: sx-monolith
  namespace: sentinelx
  labels:
    app.kubernetes.io/name: sx-monolith
    app.kubernetes.io/part-of: sentinelx
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: sx-monolith
  strategy:
    canary:
      # Linkerd native service switching — no SMI TrafficSplit.
      # The stable/canary Service objects are rendered by the Helm chart
      # and Argo Rollouts patches their selectors on each step.
      canaryService: sx-monolith-canary
      stableService: sx-monolith-stable
      maxUnavailable: 0
      maxSurge: 25%
      analysis:
        templates:
          - templateName: success-rate
          - templateName: latency-p95
        startingStep: 2
        args:
          - name: service-name
            value: sx-monolith-canary
          - name: namespace
            value: sentinelx
      steps:
        - setWeight: 10
        - pause:
            duration: 2m
        - analysis:
            templates:
              - templateName: success-rate
              - templateName: latency-p95
            args:
              - name: service-name
                value: sx-monolith-canary
              - name: namespace
                value: sentinelx
        - setWeight: 30
        - pause:
            duration: 2m
        - analysis:
            templates:
              - templateName: success-rate
              - templateName: latency-p95
            args:
              - name: service-name
                value: sx-monolith-canary
              - name: namespace
                value: sentinelx
        - setWeight: 60
        - pause:
            duration: 2m
        - analysis:
            templates:
              - templateName: success-rate
              - templateName: latency-p95
            args:
              - name: service-name
                value: sx-monolith-canary
              - name: namespace
                value: sentinelx
        - setWeight: 100
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sx-monolith
        app.kubernetes.io/part-of: sentinelx
      annotations:
        linkerd.io/inject: enabled
        config.linkerd.io/proxy-cpu-request: "100m"
        config.linkerd.io/proxy-memory-request: "64Mi"
    spec:
      serviceAccountName: sx-monolith
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sx-monolith
          # Image tag is patched by the release.yml workflow into a values
          # overlay. Placeholder REPLACE_ME guards against unsigned deploys.
          image: ghcr.io/sentinelx/sx-monolith:REPLACE_ME
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
            - containerPort: 9090
              name: metrics
              protocol: TCP
          env:
            - name: SX_BIND
              value: "0.0.0.0:8080"
            - name: SX_METRICS_BIND
              value: "0.0.0.0:9090"
          envFrom:
            - secretRef:
                name: sx-monolith-secrets
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 5
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/sentinelx
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: sx-monolith
