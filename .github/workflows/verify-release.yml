name: verify-release

# Pre-merge supply-chain gate.
#
# Builds the sx-monolith container image LOCALLY (no push, no registry write),
# generates a CycloneDX SBOM with syft, and runs trivy with the same severity
# gate the release workflow enforces. Catches CVE regressions before they ship.

on:
  pull_request:
    branches: [main]
    paths:
      - 'crates/**'
      - 'services/**'
      - 'api/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deploy/**'
      - '.github/workflows/release.yml'
      - '.github/workflows/verify-release.yml'
      - '.trivyignore'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  LOCAL_IMAGE: sentinelx/monolith:pr-${{ github.event.pull_request.number || github.run_id }}
  TRIVY_SEVERITY: CRITICAL,HIGH

# Read-only by default. We never push an image from a PR.
permissions:
  contents: read

concurrency:
  group: verify-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (sbom + trivy on PR HEAD)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # upload trivy SARIF to Code Scanning
    steps:
      - name: Checkout PR HEAD
        uses: actions/checkout@v4 # renovate: pin actions/checkout
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable # renovate: pin dtolnay/rust-toolchain
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2 # renovate: pin Swatinem/rust-cache
        with:
          shared-key: verify-release-amd64

      - name: Build sx-monolith (amd64 only, for PR speed)
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu -p sx-monolith

      - name: Stage binary for docker context
        run: |
          mkdir -p ctx/linux/amd64
          cp target/x86_64-unknown-linux-gnu/release/sx-monolith ctx/linux/amd64/sx-monolith
          chmod +x ctx/linux/amd64/sx-monolith
          cat > ctx/Dockerfile <<'EOF'
          ARG TARGETPLATFORM
          FROM gcr.io/distroless/cc-debian12:nonroot
          ARG TARGETPLATFORM
          COPY ${TARGETPLATFORM}/sx-monolith /usr/local/bin/sx-monolith
          USER nonroot
          EXPOSE 8080 9090
          ENTRYPOINT ["/usr/local/bin/sx-monolith"]
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3 # renovate: pin docker/setup-buildx-action

      - name: Build image locally (no push)
        uses: docker/build-push-action@v6 # renovate: pin docker/build-push-action
        with:
          context: ctx
          file: ctx/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.LOCAL_IMAGE }}

      - name: Generate SBOM (CycloneDX JSON via syft)
        uses: anchore/sbom-action@v0 # renovate: pin anchore/sbom-action
        with:
          image: ${{ env.LOCAL_IMAGE }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: true

      - name: Sanity-check SBOM exists
        run: |
          test -s sbom.cdx.json
          echo "SBOM size: $(wc -c < sbom.cdx.json) bytes"

      - name: Trivy CVE scan (gate on CRITICAL,HIGH)
        uses: aquasecurity/trivy-action@0.24.0 # renovate: pin aquasecurity/trivy-action
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          format: table
          severity: ${{ env.TRIVY_SEVERITY }}
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore
          vuln-type: 'os,library'

      - name: Trivy CVE scan — SARIF (Code Scanning)
        if: always()
        uses: aquasecurity/trivy-action@0.24.0 # renovate: pin aquasecurity/trivy-action
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          format: sarif
          output: trivy-results.sarif
          severity: ${{ env.TRIVY_SEVERITY }}
          ignore-unfixed: true
          trivyignores: .trivyignore
          vuln-type: 'os,library'

      - name: Upload Trivy SARIF to Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3 # renovate: pin github/codeql-action
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image-pr
