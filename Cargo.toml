[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
authors = ["rickgat <rickgat@users.noreply.github.com>"]
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/rickgat/sentinelx"
homepage = "https://github.com/rickgat/sentinelx"
publish = false

[workspace.dependencies]
# Internal crates
sx-config = { path = "crates/sx-config" }
sx-core = { path = "crates/sx-core" }
sx-telemetry = { path = "crates/sx-telemetry" }
sx-iam = { path = "crates/sx-iam" }
sx-audit = { path = "crates/sx-audit" }
sx-storage = { path = "crates/sx-storage" }
sx-engagement = { path = "crates/sx-engagement" }
sx-risk = { path = "crates/sx-risk" }
sx-discovery = { path = "crates/sx-discovery" }
sx-api = { path = "crates/sx-api" }
sx-graph = { path = "crates/sx-graph" }
sx-report = { path = "crates/sx-report" }
sx-remediation = { path = "crates/sx-remediation" }
sx-compliance = { path = "crates/sx-compliance" }
sx-bas = { path = "crates/sx-bas" }
sx-chaos = { path = "crates/sx-chaos" }
sx-rba = { path = "crates/sx-rba" }
sx-collab = { path = "crates/sx-collab" }
sx-ml = { path = "crates/sx-ml" }
sx-cloud = { path = "crates/sx-cloud" }
sx-autonomy = { path = "crates/sx-autonomy" }
sx-intel-ioc = { path = "crates/sx-intel-ioc" }
sx-intel-feeds = { path = "crates/sx-intel-feeds" }
sx-secrets = { path = "crates/sx-secrets" }
sx-dlp = { path = "crates/sx-dlp" }
sx-policy = { path = "crates/sx-policy" }
sx-twin = { path = "crates/sx-twin" }
sx-integrations = { path = "crates/sx-integrations" }
sx-mtls = { path = "crates/sx-mtls" }
sx-soc = { path = "crates/sx-soc" }
sx-log-ingest = { path = "crates/sx-log-ingest" }
sx-webhooks = { path = "crates/sx-webhooks" }
sx-vuln-ingest = { path = "crates/sx-vuln-ingest" }
sx-scim = { path = "crates/sx-scim" }
sx-device-trust = { path = "crates/sx-device-trust" }
sx-soar = { path = "crates/sx-soar" }
sx-plugins = { path = "crates/sx-plugins" }
sx-ir-playbooks = { path = "crates/sx-ir-playbooks" }
sx-runtime = { path = "crates/sx-runtime" }
sx-hunt = { path = "crates/sx-hunt" }
sx-ueba = { path = "crates/sx-ueba" }
sx-pentest = { path = "crates/sx-pentest" }
sx-xmlsec = { path = "crates/sx-xmlsec" }
sx-ai-audit = { path = "crates/sx-ai-audit" }

# Async runtime
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "fs", "net", "io-util", "process"] }
async-trait = "0.1"
futures = "0.3"
futures-util = "0.3"

# Errors
thiserror = "1.0"
anyhow = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
serde_with = "3"

# Time & IDs
uuid = { version = "1.10", features = ["v4", "v7", "serde"] }
time = { version = "0.3", features = ["serde", "macros", "formatting", "parsing"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "std", "clock"] }

# Tracing / Metrics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt", "registry"] }
tracing-opentelemetry = "0.33"
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic"] }
opentelemetry-semantic-conventions = "0.32"
metrics = "0.23"
metrics-exporter-prometheus = "0.15"

# HTTP server
axum = { version = "0.7", features = ["macros", "http2", "json", "multipart"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["trace", "cors", "compression-full", "request-id", "timeout", "limit", "set-header", "sensitive-headers"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip"] }

# Database
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "time", "macros", "migrate", "json", "chrono"] }

# Redis
redis = { version = "1.2", default-features = false, features = ["tokio-comp", "tokio-rustls-comp", "connection-manager"] }

# Config
figment = { version = "0.10", features = ["env", "yaml", "toml"] }

# Crypto / Secrets
argon2 = { version = "0.5", features = ["std"] }
# `rust_crypto` pins a pure-Rust crypto backend. jsonwebtoken 10 selects its
# CryptoProvider from a crate feature; with none enabled it panics at the
# first sign/verify ("could not automatically determine the process-level
# CryptoProvider"). Under `cargo test --workspace` feature unification
# happened to switch it on, so a single-crate `cargo test -p sx-api` would
# panic. Making it explicit here guarantees the backend for every crate and
# every build scope.
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
rand = "0.8"
rand_core = { version = "0.6", features = ["std"] }
rsa = { version = "0.9", default-features = false, features = ["sha2", "std", "pem"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
base64 = "0.22"
chacha20poly1305 = "0.10"
subtle = "2"
secrecy = { version = "0.10", features = ["serde"] }
zeroize = { version = "1", features = ["derive"] }

# XML / Compression (SAML 2.0)
# Bumped 0.36 → 0.41 (2026-08-04) to close RUSTSEC-2026-0194/0195
# (memory-exhaustion + quadratic-time DoS on untrusted XML). Migration
# touched 25 call sites across sx-iam SAML + sx-remediation MSRC:
#   * `BytesText::unescape()` → `decoder.decode()` + `unescape()`
#   * `Attribute::unescape_value()` → `Attribute::normalized_value()`
# Both API changes are semantically equivalent — no behaviour change.
quick-xml = "0.41"
flate2 = "1"

# Validation
# LOW-001-FU1 (2026-06-16): bumped 0.18 -> 0.20 to remediate RUSTSEC-2024-0421
# (idna Punycode acceptance bug). validator 0.20 transitively switches to
# idna >= 1.0. MSRV 1.81 is compatible with the workspace's 1.88 pin.
validator = { version = "0.20", features = ["derive"] }
regex = "1"
ipnet = { version = "2", features = ["serde"] }
url = { version = "2", features = ["serde"] }

# DNS / Network
# LOW-001-FU4 (2026-06-23): bumped 0.24 -> 0.26 to remediate RUSTSEC-2026-0119
# (O(n^2) DNS name-compression DoS). The 0.26 line renames `tokio-runtime`
# feature to `tokio`, restructures the resolver builder API
# (`TokioAsyncResolver::tokio(cfg, opts)` -> `Resolver::builder_with_config`),
# and tightens the `hickory-server::RequestHandler` lifetime bounds. MSRV
# 1.88 matches the workspace pin.
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio", "system-config"] }
hickory-server = { version = "0.26", default-features = false, features = ["resolver"] }
hickory-proto = { version = "0.26", default-features = false }
octocrab = { version = "0.54", default-features = false, features = ["rustls", "rustls-ring", "default-client", "retry", "timeout", "tracing", "jwt-rust-crypto"] }

# Graph database
neo4rs = "0.8"

# PDF generation. Pinned to 0.7.x pending API-breaking migration to
# printpdf 0.12+ (which ships lopdf ≥ 0.42 and closes RUSTSEC-2026-0187).
# The 0.31 lopdf CVE (stack-overflow on deeply-nested PDF *reading*)
# does NOT affect our write-only compliance + report path, so this is
# risk-accepted for now. Track: TODO(P1) migrate to printpdf 0.12.
printpdf = "0.7"

# Markdown parsing (pure Rust, no system deps)
pulldown-cmark = { version = "0.12", default-features = false }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Concurrent maps (sharded RwLocks)
dashmap = "6"

# Dev / testing
mockall = "0.13"
proptest = "1"
wiremock = "0.6"
rstest = "0.23"

# WASM plugin sandbox (CRIT-001)
# LOW-001-FU2 (2026-06-23): bumped 24.0.7 -> =36.0.11 alongside the rustc
# 1.88 -> 1.92 MSRV cascade. The 36 line patches the 6 wasmtime advisories
# that were ignored in LOW-001-FU1 (RUSTSEC-2026-0086 / -0088 / -0089 /
# -0094 / -0095 / -0096) — Winch JIT backend codegen bugs, the pooling
# allocator unsoundness, and the aarch64 Cranelift miscompile. We keep
# `features = ["cranelift", "runtime"]` only; Winch and the pooling
# allocator remain OFF so we get defence-in-depth (by-config) on top of
# the by-version fix.
#
# API fixups vs 24.0.7:
#  * `ResourceLimiter::table_growing` arg type went `u32` -> `usize`
#    (the same signature wasmtime had at 26+ and re-stabilised in 36).
#    See `crates/sx-plugins/src/wasm_host.rs`.
#  * `Trap::OutOfFuel`, `Module::validate`, `Linker`, `Store`,
#    `Caller::data_mut`, `set_fuel` all stable across 24..=36.
#
# CI-FF-01 (2026-11-07): bumped =36.0.13 -> =36.0.20 to patch the wasmtime
# advisories that landed against the 36 line after the original pin —
# RUSTSEC-2026-0269 (filesystem-sandbox-escape via trailing slashes),
# -0316, -0363, -0379, -0380 and -0424 (Cranelift miscompiles, component
# handle-table / borrowed-resource memory accounting). All are fixed within
# the 36.x patch series (>=36.0.20, <37.0.0), so no major API churn.
#
# `wat` is used by tests to compile WebAssembly text fixtures down to bytes.
wasmtime = { version = "=36.0.20", default-features = false, features = ["cranelift", "runtime"] }
wat = "1.246"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "warn"
unimplemented = "warn"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
integer_division = "warn"
indexing_slicing = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
multiple_crate_versions = "allow"
cargo_common_metadata = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
debug = false
overflow-checks = true

[profile.dev]
opt-level = 0
debug = true
overflow-checks = true

[profile.test]
opt-level = 1
