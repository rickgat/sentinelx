# HashiCorp Vault Helm overlay for SentinelX.
# Mapped controls: NIST SP 800-53 SC-12, SC-28, ISO/IEC 27001 A.5.17, A.8.24.

global:
  enabled: true
  tlsDisable: false

injector:
  enabled: true
  replicas: 2
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 250m
      memory: 256Mi
  metrics:
    enabled: true
  webhook:
    failurePolicy: Fail

server:
  image:
    repository: hashicorp/vault
    tag: "1.17.3"
  logLevel: info
  logFormat: json
  updateStrategyType: RollingUpdate
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  serviceAccount:
    create: true
    name: vault
    # Replace with the IRSA role ARN that has KMS permissions on
    # alias/sentinelx-vault.
    annotations:
      eks.amazonaws.com/role-arn: REPLACE_ME

  dataStorage:
    enabled: true
    size: 10Gi
    storageClass: gp3
    accessMode: ReadWriteOnce

  auditStorage:
    enabled: true
    size: 5Gi
    storageClass: gp3

  standalone:
    enabled: false

  ha:
    enabled: true
    replicas: 5
    apiAddr: null
    clusterAddr: null
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = true

        listener "tcp" {
          tls_disable                = 0
          address                    = "[::]:8200"
          cluster_address            = "[::]:8201"
          tls_cert_file              = "/vault/userconfig/vault-tls/tls.crt"
          tls_key_file               = "/vault/userconfig/vault-tls/tls.key"
          tls_client_ca_file         = "/vault/userconfig/vault-tls/ca.crt"
          telemetry {
            unauthenticated_metrics_access = false
          }
        }

        storage "raft" {
          path = "/vault/data"
          retry_join {
            leader_api_addr = "https://vault-0.vault-internal:8200"
          }
          retry_join {
            leader_api_addr = "https://vault-1.vault-internal:8200"
          }
          retry_join {
            leader_api_addr = "https://vault-2.vault-internal:8200"
          }
          retry_join {
            leader_api_addr = "https://vault-3.vault-internal:8200"
          }
          retry_join {
            leader_api_addr = "https://vault-4.vault-internal:8200"
          }
        }

        # AWS KMS auto-unseal. The CMK lives in ap-southeast-1.
        seal "awskms" {
          region     = "ap-southeast-1"
          kms_key_id = "alias/sentinelx-vault"
        }

        service_registration "kubernetes" {}

        telemetry {
          prometheus_retention_time = "30s"
          disable_hostname          = true
        }

  service:
    enabled: true
    type: ClusterIP

  ingress:
    enabled: false

  extraEnvironmentVars:
    VAULT_ADDR: https://127.0.0.1:8200
    VAULT_CACERT: /vault/userconfig/vault-tls/ca.crt

  extraVolumes:
    - type: secret
      name: vault-tls

  readinessProbe:
    enabled: true
    path: /v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204
  livenessProbe:
    enabled: true
    path: /v1/sys/health?standbyok=true
    initialDelaySeconds: 60

ui:
  enabled: true
  serviceType: ClusterIP

csi:
  enabled: false
