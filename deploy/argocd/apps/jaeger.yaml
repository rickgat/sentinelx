# Child Application: Jaeger (all-in-one for dev / production-ready
# distributed mode toggled via values overlay). Sync wave 5 — needs to
# be available before the OTel collector starts forwarding spans.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sentinelx-jaeger
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: sentinelx-jaeger
    app.kubernetes.io/part-of: sentinelx
    app.kubernetes.io/component: tracing
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: sentinelx
  sources:
    - repoURL: https://jaegertracing.github.io/helm-charts
      chart: jaeger
      targetRevision: 3.3.3
      helm:
        releaseName: jaeger
        valueFiles:
          - $values/deploy/argocd/apps/values/jaeger-values.yaml
    - repoURL: https://github.com/sentinelx/security-check
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: sentinelx-observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - Replace=false
      - PruneLast=true
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 10m
  revisionHistoryLimit: 10
