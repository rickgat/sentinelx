# Standalone Application for the SentinelX monolith.
# Useful as a one-cluster bootstrap or when ApplicationSet generators are
# disabled. In normal operation the ApplicationSet template overrides this.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sentinelx-monolith
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: sentinelx
  source:
    repoURL: https://github.com/sentinelx/sentinelx-infra
    targetRevision: main
    path: deploy/helm/sentinelx
    helm:
      releaseName: sentinelx-monolith
      valueFiles:
        - values.yaml
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: sentinelx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
  revisionHistoryLimit: 10
